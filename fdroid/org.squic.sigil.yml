# The part of the app's F-Droid metadata that does not move. The versions
# (`Builds:`, `CurrentVersion*`) are appended by scripts/fdroid-repo from
# the APKs it is given, so this file never has to be bumped for a release.
#
# The listing text, the icon and the screenshots are not here: they live in
# fastlane/metadata/android/en-US/, which is the format IzzyOnDroid and
# f-droid.org read too.
