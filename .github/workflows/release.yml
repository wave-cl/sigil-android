# A release: the bundle Play takes and the APK a phone takes over adb, both
# signed with the upload key, attached to a GitHub release -- and, when a
# Play service account is in the secrets, pushed to a Play track.
#
# Runs on a `v*` tag whose version is the workspace's. **sigil is built at the
# ref in `.sigil-ref`**, not at `main`: it is a path dependency, so whatever is
# checked out beside this repo *is* half the artefact, and a tag push carries
# no dispatch inputs -- so a `main` default meant the normal release path built
# against a moving target and said nothing about it. A dispatch may override
# the file; a tag push may not, because a release nobody can rebuild is not a
# release.
#
# sqex and sqnr are **not** checked out. Nothing references `../sqex` or
# `../sqnr`: cargo resolves them from the git tags in Cargo.toml. Checking them
# out and printing their shas in the release notes said the build used commits
# it had never read, which is worse than saying nothing.
#
# Secrets (docs/play-store.md):
#   SIGIL_UPLOAD_KEYSTORE_B64       the PKCS12 from scripts/upload-key, base64
#   SIGIL_UPLOAD_KEYSTORE_PASSWORD
#   SIGIL_UPLOAD_KEY_ALIAS
#   SIGIL_UPLOAD_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON       optional: a Play Console service account's key
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sigil_ref:
        description: "wave-cl/sigil ref to build against (blank: the ref in .sigil-ref)"
      track:
        description: "Play track to upload to (blank: no upload)"
        default: internal

env:
  TRACK: ${{ github.event.inputs.track || 'internal' }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sigil-android

      # Which sigil this is. The file is the answer on a tag push, where there
      # are no dispatch inputs at all; a dispatch may name another.
      - name: Which sigil
        id: sigil
        run: |
          given="${{ github.event.inputs.sigil_ref }}"
          if [ -n "$given" ]; then
            ref="$given"
            echo "sigil ref from the dispatch: $ref"
          else
            ref="$(tr -d '[:space:]' < sigil-android/.sigil-ref)"
            [ -n "$ref" ] || { echo ".sigil-ref is empty: name the sigil tag to build against"; exit 1; }
            echo "sigil ref from .sigil-ref: $ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: wave-cl/sigil
          ref: ${{ steps.sigil.outputs.ref }}
          path: sigil

      # The tag is the version, or the release is misnamed from the start.
      - name: Version
        id: version
        run: |
          v="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p;}' sigil-android/Cargo.toml)"
          [ -n "$v" ] || { echo "no workspace version"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "tag ${GITHUB_REF_NAME} is not the workspace version v$v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # No key, no release: the fallback in build.gradle.kts is for a phone
      # over adb, and a debug-signed bundle is one Play refuses later.
      - name: Upload key
        run: |
          for v in SIGIL_UPLOAD_KEYSTORE_B64 SIGIL_UPLOAD_KEYSTORE_PASSWORD SIGIL_UPLOAD_KEY_ALIAS SIGIL_UPLOAD_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "secret $v is not set (docs/play-store.md)"; exit 1; }
          done
          printf '%s' "$SIGIL_UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          chmod 600 "$RUNNER_TEMP/upload.p12"
          echo "SIGIL_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
        env:
          SIGIL_UPLOAD_KEYSTORE_B64: ${{ secrets.SIGIL_UPLOAD_KEYSTORE_B64 }}
          SIGIL_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SIGIL_UPLOAD_KEYSTORE_PASSWORD }}
          SIGIL_UPLOAD_KEY_ALIAS: ${{ secrets.SIGIL_UPLOAD_KEY_ALIAS }}
          SIGIL_UPLOAD_KEY_PASSWORD: ${{ secrets.SIGIL_UPLOAD_KEY_PASSWORD }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The Rust cache first: it carries ~/.cargo/bin, so the cargo-ndk
      # below is already installed on a warm run and `cargo install` is a
      # no-op rather than a build from source.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sigil-android
      # Gradle's own distribution and dependency caches: the wrapper step
      # downloaded Gradle on every run, 70 s of a seven-minute release.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-8.11.1-${{ hashFiles('sigil-android/android/**/*.kts') }}
          restore-keys: gradle-${{ runner.os }}-8.11.1-
      - name: NDK and cargo-ndk
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=27.2.12479018" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      # Evaluates build.gradle.kts, which wants the whole upload key or none
      # of it; the keystore path is already in the environment from above.
      - name: Gradle wrapper
        run: cd sigil-android/android && gradle wrapper --gradle-version 8.11.1
        env:
          SIGIL_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SIGIL_UPLOAD_KEYSTORE_PASSWORD }}
          SIGIL_UPLOAD_KEY_ALIAS: ${{ secrets.SIGIL_UPLOAD_KEY_ALIAS }}
          SIGIL_UPLOAD_KEY_PASSWORD: ${{ secrets.SIGIL_UPLOAD_KEY_PASSWORD }}

      # Both signed with the upload key, since it is in the environment: the
      # APK installs over the Play build on a phone, and the other way.
      - name: Bundle
        run: cd sigil-android && scripts/build-apk --bundle
        env:
          SIGIL_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SIGIL_UPLOAD_KEYSTORE_PASSWORD }}
          SIGIL_UPLOAD_KEY_ALIAS: ${{ secrets.SIGIL_UPLOAD_KEY_ALIAS }}
          SIGIL_UPLOAD_KEY_PASSWORD: ${{ secrets.SIGIL_UPLOAD_KEY_PASSWORD }}
      - name: APK
        run: cd sigil-android && scripts/build-apk --release
        env:
          SIGIL_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SIGIL_UPLOAD_KEYSTORE_PASSWORD }}
          SIGIL_UPLOAD_KEY_ALIAS: ${{ secrets.SIGIL_UPLOAD_KEY_ALIAS }}
          SIGIL_UPLOAD_KEY_PASSWORD: ${{ secrets.SIGIL_UPLOAD_KEY_PASSWORD }}

      - name: Name the artifacts
        id: artifacts
        run: |
          v="${{ steps.version.outputs.version }}"
          SIGIL_TAG="${{ steps.sigil.outputs.ref }}"
          mkdir -p out

          # What cargo actually resolved, read out of the lock rather than
          # named by hand, so a disagreement between the two trees' pins shows
          # up in the notes and not in an APK somebody has already installed.
          # **Guarded**: a pattern that stops matching would otherwise write
          # notes with no dependencies in them and say nothing about it.
          sed -n 's|^source = "git+https://github.com/wave-cl/\([a-z-]*\)?tag=\([^#]*\)#\(.*\)"|- \1 \2 `\3`|p' \
            sigil-android/Cargo.lock | sort -u > pinned.md
          [ -s pinned.md ] || {
            echo "no pinned git dependencies found in Cargo.lock -- the lock's"
            echo "source format has changed and these notes would be empty"
            exit 1
          }
          cp sigil-android/android/app/build/outputs/bundle/release/app-release.aab "out/sigil-android-v$v.aab"
          cp sigil-android/android/app/build/outputs/apk/release/app-release.apk "out/sigil-android-v$v.apk"
          {
            echo "Built from:"
            echo "- sigil-android \`$(git -C sigil-android rev-parse HEAD)\`"
            echo "- sigil ${SIGIL_TAG} \`$(git -C sigil rev-parse HEAD)\`"
            cat pinned.md
            echo
            echo "The \`.aab\` is what Play was given; the \`.apk\` installs over adb and is signed with the same key."
          } > out/notes.md
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: sigil-android-v${{ steps.version.outputs.version }}
          path: out/*

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/*.aab out/*.apk \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file out/notes.md

      # The console has to know the app first: it is created there by hand,
      # with the first bundle uploaded by hand to enrol in Play app signing.
      # From then on this puts each release on the track named.
      - name: Play upload
        if: env.TRACK != '' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.squic.sigil
          releaseFiles: out/sigil-android-v${{ steps.version.outputs.version }}.aab
          track: ${{ env.TRACK }}
          status: completed
