org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true
kotlin.code.style=official
# compileSdk 37 on AGP 8.7 (see app/build.gradle.kts).
android.suppressUnsupportedCompileSdk=37
# The ABI to build, from `cargo ndk`; scripts/build-apk sets it.
sigil.abi=arm64-v8a

# The UnifiedPush FCM gateway (rewrite proxy) for the embedded distributor,
# with no trailing slash. Empty: no embedded distributor; a UnifiedPush
# distributor must be installed on the phone.
sigil.wakeProxy=
